worker_processes 1;
pid run/nginx.pid;
error_log logs/error.log;
events { worker_connections 512; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log logs/access.log;
    client_body_temp_path run/client_body;
    proxy_temp_path run/proxy;
    client_max_body_size 1m;
    limit_req_zone $binary_remote_addr zone=livelife_api:1m rate=10r/s;
    server {
        listen 443 ssl;
        server_name 192.144.253.40;
        ssl_certificate /opt/livelife/tls/fullchain.pem;
        ssl_certificate_key /opt/livelife/tls/key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        auth_basic "Livelife test";
        auth_basic_user_file /opt/livelife/credentials/htpasswd;
        autoindex off;
        gzip_vary on;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        # Infrastructure Basic credentials must not reach the application.
        proxy_set_header Authorization "";
        location = /__livelife/versions.json {
            limit_req zone=livelife_api burst=20 nodelay;
            alias /opt/livelife/gateway/data/versions.json;
            default_type application/json;
            add_header Cache-Control no-store;
        }
        location ^~ /__livelife/web-builds/ {
            alias /opt/livelife/web/builds/;
            gzip_static on;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
        location ^~ /__livelife/web-assets/ {
            alias /opt/livelife/web/shared/;
            gzip_static on;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
        include config/routes.conf;
        location / { return 404; }
    }
}
