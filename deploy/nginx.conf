worker_processes 1;
pid run/nginx.pid;
error_log logs/error.log;
events { worker_connections 512; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log logs/access.log;
    client_body_temp_path run/client_body;
    proxy_temp_path run/proxy;
    client_max_body_size 1m;
    limit_req_zone $binary_remote_addr zone=livelife_api:1m rate=10r/s;
    map $http_x_livelife_preview_key $livelife_header_valid {
        default 0;
        include /opt/livelife/credentials/preview-key.conf;
    }
    map $cookie_livelife_preview $livelife_cookie_valid {
        default 0;
        include /opt/livelife/credentials/preview-key.conf;
    }
    map $uri $livelife_public_entry {
        volatile;
        default 0;
        /__livelife/access 1;
        /__livelife/access-form.html 1;
    }
    map $http_cookie $livelife_duplicate_cookie {
        default 0;
        "~*(?:^|;\\s*)livelife_preview=[^;]*;.*livelife_preview=" 1;
    }
    map "$livelife_duplicate_cookie:$livelife_public_entry:$livelife_header_valid:$livelife_cookie_valid" $livelife_access {
        volatile;
        default 0;
        ~^0:.*1 1;
    }
    # Keep future application cookies, but never forward the preview secret.
    map $http_cookie $livelife_application_cookie {
        default $http_cookie;
        "~*^livelife_preview=[^;]*(?:;\\s*(?<livelife_cookie_rest>.*))?$" $livelife_cookie_rest;
        "~*^(?<livelife_cookie_before>.*?);\\s*livelife_preview=[^;]*(?<livelife_cookie_after>;.*)?$" "$livelife_cookie_before$livelife_cookie_after";
    }
    server {
        listen 443 ssl;
        server_name 192.144.253.40;
        ssl_certificate /opt/livelife/tls/fullchain.pem;
        ssl_certificate_key /opt/livelife/tls/key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        if ($livelife_access = 0) { return 401; }
        error_page 401 /__livelife/access-form.html;
        autoindex off;
        gzip_vary on;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        location = /__livelife/access-form.html {
            internal;
            alias /opt/livelife/gateway/access.html;
            default_type text/html;
            add_header Cache-Control no-store always;
        }
        location = /__livelife/access {
            if ($request_method != POST) { return 405; }
            if ($livelife_header_valid = 0) { return 403; }
            add_header Set-Cookie "livelife_preview=$http_x_livelife_preview_key; Path=/; Secure; HttpOnly; SameSite=Lax; Max-Age=604800";
            add_header Cache-Control no-store always;
            return 204;
        }
        location = /__livelife/versions.json {
            limit_req zone=livelife_api burst=20 nodelay;
            alias /opt/livelife/gateway/data/versions.json;
            default_type application/json;
            add_header Cache-Control no-store;
        }
        location ^~ /__livelife/web-builds/ {
            alias /opt/livelife/web/builds/;
            gzip_static on;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
        location ^~ /__livelife/web-assets/ {
            alias /opt/livelife/web/shared/;
            gzip_static on;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
        include config/routes.conf;
        location / { return 404; }
    }
}
