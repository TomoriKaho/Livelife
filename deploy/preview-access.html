<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Livelife 测试访问</title>
  <style>
    body { margin: 0; padding: 24px; font: 16px/1.6 system-ui,sans-serif; background: #f4f6f8; color: #16212b; }
    main { max-width: 420px; margin: 12vh auto; padding: 28px; border-radius: 16px; background: white; box-shadow: 0 4px 24px #16212b12; }
    h1 { font-size: 24px; margin-top: 0; }
    label,input,button { display: block; box-sizing: border-box; width: 100%; }
    input,button { padding: 12px; margin-top: 10px; border-radius: 8px; font: inherit; }
    input { border: 1px solid #a0abb5; }
    button { border: 0; background: #2367c9; color: white; cursor: pointer; }
    button:disabled { opacity: .6; cursor: wait; }
    #message { color: #b42318; min-height: 1.6em; }
    small { color: #586672; }
  </style>
</head>
<body>
<main>
  <h1>Livelife 测试访问</h1>
  <p>请输入维护者提供的访问 key，进入当前测试地址。</p>
  <form id="access-form">
    <label for="key">访问 key</label>
    <input id="key" type="password" required autocomplete="off" spellcheck="false" autocapitalize="none">
    <button id="submit" type="submit">进入测试</button>
    <p id="message" role="alert" aria-live="polite"></p>
  </form>
  <small>当前浏览器保留凭证 7 天。此 key 用于测试入口，软件账号另行登录。</small>
</main>
<script>
  document.getElementById('access-form').addEventListener('submit', async (event) => {
    event.preventDefault();
    const input = document.getElementById('key');
    const button = document.getElementById('submit');
    const message = document.getElementById('message');
    button.disabled = true;
    message.textContent = '';
    try {
      const response = await fetch('/__livelife/access', {
        method: 'POST', credentials: 'same-origin', cache: 'no-store',
        headers: { 'X-Livelife-Preview-Key': input.value.trim() }
      });
      if (response.status !== 204) {
        message.textContent = response.status === 403 ? '访问 key 不正确，请检查后重试。' : '暂时无法验证，请稍后重试。';
        return;
      }
      input.value = '';
      window.location.reload();
    } catch {
      message.textContent = '网络连接失败，请检查连接后重试。';
    } finally {
      button.disabled = false;
    }
  });
</script>
</body>
</html>
