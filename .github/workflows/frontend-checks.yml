name: Frontend build request

on:
  push:
    paths: ["frontend/**", "deploy/**", ".github/workflows/frontend-*.yml"]
  pull_request:
    types: [opened, synchronize, reopened]
    paths: ["frontend/**", "deploy/**", ".github/workflows/frontend-*.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  request:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      # No checkout, build or credentials. The default-branch workflow_run
      # controller verifies this run before it submits any course-host task.
      - name: Request course-host checks
        run: |
          echo "Course-host request recorded; this step does not certify that tests passed." >> "$GITHUB_STEP_SUMMARY"
          echo "Follow the Frontend checks commit status and Preview environments for the real result." >> "$GITHUB_STEP_SUMMARY"
