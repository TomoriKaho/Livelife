name: Backend checks

on:
  push:
    paths: ["backend/**", "deploy/**", ".github/workflows/backend-*.yml"]
  pull_request:
    types: [opened, synchronize, reopened]
    paths: ["backend/**", "deploy/**", ".github/workflows/backend-*.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install gateway test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nginx-core
      - name: Check infrastructure behavior
        run: |
          python -m pip install --disable-pip-version-check 'supervisor==4.3.0' 'uv==0.12.23'
          python -m unittest discover -s deploy/tests -v
      - name: Check and package backend
        run: python deploy/prepare-backend.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-bundle
          path: deploy/.state/backend-artifact/
          retention-days: 7
          if-no-files-found: error
