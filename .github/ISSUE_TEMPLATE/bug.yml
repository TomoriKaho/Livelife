name: Bug 报告
description: 提供可复现信息，便于定位和验证修复
body:
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: "1. 登录测试账号\n2. 打开兴趣设置\n3. 保存订阅"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 环境与版本
      description: 设备、系统、浏览器或 APP 版本、测试地址、提交 SHA。
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 截图、日志及关联任务
      description: 可粘贴截图；移除密码、令牌和私有内容后再提交日志。
